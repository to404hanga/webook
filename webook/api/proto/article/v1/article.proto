syntax = "proto3";

package article.v1;
option go_package = "article/v1;articlev1";

import "google/protobuf/timestamp.proto";

message Author {
    int64 id = 1;
    string name = 2;
}

message Article {
    int64 id = 1;
    string title = 2;
    int32 status = 3;
    string content = 4;
    Author author = 5;
    google.protobuf.Timestamp create_time = 6;
    google.protobuf.Timestamp update_time = 7;
    string abstract = 8;
}

service ArticleService {
    rpc Save(SaveRequest) returns (SaveResponse);
    rpc Publish(PublishRequest) returns (PublishResponse);
    rpc Withdraw(WithdrawRequest) returns (WithdrawResponse);
    rpc List(ListRequest) returns (ListResponse);
    rpc GetById(GetByIdRequest) returns (GetByIdResponse);
    rpc GetPubById(GetPubByIdRequest) returns (GetPubByIdResponse);
    rpc ListPub(ListPubRequest) returns (ListPubResponse);
}

message SaveRequest {
    Article Article = 1;
}

message SaveResponse {
    int64 id = 1;
}

message PublishRequest {
    Article Article = 1;
}

message PublishResponse {
    int64 id = 1;
}

message WithdrawRequest {
    int64 uid = 1;
    int64 id = 2;
}

message WithdrawResponse {

}

message ListRequest {
    int64 author = 1;
    int64 offset = 2;
    int64 limit = 3;
}

message ListResponse {
    repeated Article articles = 1;
}

message GetByIdRequest {
    int64 id = 1;
}

message GetByIdResponse {
    Article article = 1;
}

message GetPubByIdRequest {
    int64 id = 1;
    int64 uid = 2;
}

message GetPubByIdResponse {
    Article article = 1;
}

message ListPubRequest {
    google.protobuf.Timestamp start_time = 1;
    int64 offset = 2;
    int64 limit = 3;
}

message ListPubResponse {
    repeated Article articles = 1;
}