# 启动命令
# C:\'Program Files'\Docker\Docker\resources\bin\docker.exe compose up

version: "3"
# docker compose 由几个服务组成
services:
  mongo:
    image: mongo:6.0
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=123456
    ports:
      - 27017:27017
  # # 服务名: mysql8
  # mysql8:
  #   # 镜像
  #   image: mysql:8.0
  #   # 重启策略
  #   restart: always
  #   # 命令参数
  #   command: --default-authentication-plugin=mysql_native_password
  #   # 环境变量
  #   environment:
  #     # mysql root 用户密码
  #     MYSQL_ROOT_PASSWORD: root
  #   volumes:
  #     # 初始化脚本
  #     - ./script/mysql/:/docker-entrypoint-initdb.d/
  #   ports:
  #     # docker 外部通过 13316 端口访问
  #     - 13316:3306
  
  # # redis
  # redis:
  #   image: "bitnami/redis:latest"
  #   restart: always
  #   environment:
  #     - ALLOW_EMPTY_PASSWORD=yes
  #   ports:
  #     - "16379:6379"

  # etcd:
  #   image: "bitnami/etcd:latest"
  #   restart: always
  #   environment:
  #     - ALLOW_NONE_AUTHENTICATION=yes
  #   ports:
  #     - "12379:2379"
  kafka:
    image: 'bitnami/kafka:3.6.0'
    ports:
      - '9092:9092'
      - '9094:9094'
    environment:
      - KAFKA_CFG_NODE_ID=0
#      - 允许自动创建 topic，线上不要开启
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://:9093,EXTERNAL://0.0.0.0:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
  prometheus:
    image: prom/prometheus:v2.47.2
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
    ports:
      - 9090:9090
  zipkin:
    image: openzipkin/zipkin-slim:2.24
    ports:
      - '9411:9411'

  # 初始账号密码都是 admin
  grafana:
    image: grafana/grafana-enterprise:10.2.0
    ports:
      - 3000:3000

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.13.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - "xpack.security.enabled=false"
      - "ES_JAVA_OPTS=-Xms84m -Xmx512m"
    ports:
      - "9200:9200"

  logstash:
    image: docker.elastic.co/logstash/logstash:7.13.0
    volumes:
      - ./config/logstash:/usr/share/logstash/pipeline
      - ./logstash-logs:/usr/share/logstash/logs
    environment:
      - "xpack.monitoring.elasticsearch.hosts=http://elasticsearch:9200"
    ports:
      - 5044:5044
  
  kibana:
    image: docker.elastic.co/kibana/kibana:7.13.0
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - i18n.locale=zh-CN
    ports:
      - 5601:5601